<!DOCTYPE html>
<html lang="en">
<head>
    <title>reactive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="Scripts/reactive.css" />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] { display: none; }

        :root {
            font-family: sans-serif;
        }

        :root[data-theme='dark'] {
            color-scheme: dark;
            --text-color: rgb(255 255 255 / 0.75);
            --muted-color: rgb(255 255 255 / 0.45);
            --panel-bg: rgb(255 255 255 / 0.04);
            --panel-border: rgb(255 255 255 / 0.12);
            --accent: #818cf8;
        }

        :root[data-theme='light'] {
            color-scheme: light;
            --text-color: #0f172a;
            --muted-color: #64748b;
            --panel-bg: #ffffff;
            --panel-border: #e2e8f0;
            --accent: #4f46e5;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            color: var(--text-color);
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
        }

        h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }

        .row { display: flex; align-items: center; gap: 0.75rem; }

        button {
            width: 2.5rem;
            height: 2.5rem;
            font-size: 1.25rem;
            border-radius: 0.6rem;
            cursor: pointer;
            color: var(--text-color);
            background: transparent;
            border: 1px solid var(--panel-border);
        }

        button:hover { border-color: var(--accent); color: var(--accent); }

        .reset { width: auto; height: auto; padding: 0.4rem 1rem; font-size: 0.85rem; }

        .field {
            width: 4rem;
            text-align: center;
            font-size: 1.5rem;
            font-variant-numeric: tabular-nums;
            background: transparent;
            border: 1px solid var(--panel-border);
            border-radius: 0.6rem;
            color: var(--text-color);
        }

        p { margin: 0; font-size: 1rem; color: var(--muted-color); }
    </style>
    <script type="text/javascript" src="Scripts/reactive.head.js"></script>
</head>
<body>
    <!-- A minimal page: the client fills the holes and binds the template. -->
    <div class="card">
        <h1>Reactive counter</h1>
        <div class="row">
            <button ws-onclick="Decrement" aria-label="decrement">&minus;</button>
            <input class="field" type="number" ws-var="Count" />
            <button ws-onclick="Increment" aria-label="increment">+</button>
        </div>
        <p>square = <span ws-hole="Squared">0</span></p>
        <p>parity = <span ws-hole="Parity">even</span></p>
        <button class="reset" ws-onclick="Reset">Reset</button>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const theme = params.get('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
    <script type="module" src="Scripts/reactive.min.js"></script>
</body>
</html>
