<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forms</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] {
            display: none;
        }

        :root {
            font-family: sans-serif;
            --text-color: #e2e8f0;
            --bg-color: #0f172a;
            --input-bg: #1e293b;
            --border-color: #334155;
            --accent-color: #3b82f6;
        }

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: var(--text-color);
            background-color: transparent;
        }

        #main {
            display: flex !important;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10vh;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        form {
            width: 100%;
            max-width: 350px;
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background-color: #1e293b;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.3rem;
            color: var(--text-color);
            font-size: 1rem;
            padding: 0.6rem;
            outline: none;
            transition: border-color 0.2s;
        }

            input:focus {
                border-color: var(--accent-color);
                box-shadow: 0 0 0 1px var(--accent-color);
            }

        button {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.3rem;
            background-color: transparent;
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

            button:hover {
                background-color: var(--accent-color);
                border-color: var(--accent-color);
                color: white;
            }

        .error-msg {
            color: #f87171;
            margin-top: 0.8rem;
            text-align: center;
            font-size: 0.9rem;
            min-height: 1.4em;
        }
    </style>
    <script type="text/javascript" src="Scripts/forms.head.js"></script>
</head>
<body>
    <div id="main" ws-children-template="LoginForm">
        <form>
            <div class="input-group">
                <label>Username</label>
                <input type="text" ws-var="Username" required autocomplete="off" />
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" ws-var="Password" required />
            </div>

            <button type="submit" ws-onclick="Login">Log in</button>

            <div class="error-msg">
                <span ws-replace="ErrorMsg"></span>
            </div>
        </form>
    </div>
    <script type="module" src="Scripts/forms.min.js"></script>
</body>
</html>
