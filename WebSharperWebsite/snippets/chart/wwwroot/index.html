<!DOCTYPE html>
<html lang="en">
<head>
    <title>chart</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="Scripts/chart.css" />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] { display: none; }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
        }
        #main {
            width: 100%;
            height: 500px;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .chart { width: 100%; height: 100%; }
    </style>
    <script type="text/javascript" src="Scripts/chart.head.js"></script>
</head>
<body>
    <div id="main">
        <div class="chart" ws-onafterrender="DrawChart"></div>
    </div>
    <script type="module" src="Scripts/chart.min.js"></script>
</body>
</html>
