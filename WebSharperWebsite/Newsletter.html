<form method="post" ws-onsubmit="OnSubscribe">
    <h2 class="font-semibold text-gray-800 dark:text-white">Subscribe now</h2>
    <p class="text-sm mt-2 text-gray-700 dark:text-gray-300">Stay updated on new releases and features, guides, and case studies.</p>

    <div class="mt-8 flex gap-2">
        <input placeholder="Email" class="w-full bg-white rounded-md shadow-sm shadow-gray-950/5 border border-gray-300 bg-transparent px-3.5 py-2 text-sm text-gray-500 placeholder-gray-500 invalid:border-red-500 dark:border-gray-700 dark:hover:border-gray-600 dark:text-white dark:placeholder-gray-200 dark:bg-gray-900" type="email" name="email" id="email" ws-var="SubscribeEmail" />
        <button type="submit" class="w-fit rounded-lg h-10 bg-gray-950 dark:bg-white border border-gray-950 dark:border-gray-800 flex justify-center items-center px-4 text-white dark:text-gray-950 relative before:absolute before:inset-0 before:rounded-[7px] before:border-t before:border-gray-500 before:bg-gradient-to-b before:from-gray-700 dark:before:from-gray-200 dark:before:border-gray-950 hover:before:from-gray-950 dark:hover:before:from-gray-300">
            <span class="relative text-sm">Subscribe</span>
        </button>
    </div>
    <div id="newsletterStatus" class="mt-3 text-sm text-gray-600 dark:text-gray-400" ws-hole="SubscribeStatus"></div>
</form>
