<main ws-children-template="Content">
  <div class="relative">
    <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-0 h-[480px] overflow-hidden">
      <img src="/Assets/images/blog-hero-light.svg" alt="" class="h-full w-full object-cover object-top dark:hidden" />
      <img src="/Assets/images/blog-hero-dark.svg" alt="" class="hidden h-full w-full object-cover object-top dark:block" />
      <div class="absolute inset-0 bg-gradient-to-b from-white/45 via-white/70 to-white dark:from-gray-950/55 dark:via-gray-950/85 dark:to-gray-950"></div>
    </div>

    <div class="relative z-10 mx-auto max-w-6xl px-6 pt-28 lg:px-8 xl:px-0 2xl:max-w-7xl">
        <div class="mx-auto max-w-3xl text-center">
            <a href="/blogs" class="inline-flex items-center gap-1.5 text-sm font-medium text-indigo-600 transition duration-300 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300">
                <span aria-hidden="true">&larr;</span> All articles
            </a>
            <p class="mt-6 text-base font-semibold leading-7 text-indigo-600 dark:text-indigo-400">Blogs</p>
            <h1 class="mt-2 text-4xl font-bold tracking-tight text-gray-950 dark:text-white sm:text-5xl" ws-hole="Title">Article</h1>
            <div class="mt-6" ws-hole="Meta"></div>
        </div>

        <div class="relative mt-12 lg:flex">
            <div class="sticky top-28 mb-16 hidden h-max justify-end lg:flex lg:w-[10rem] xl:w-[6rem]">
                <div class="ml-auto flex flex-col items-end">
                    <div ws-hole="SectionNav"></div>
                </div>
            </div>
            <div class="lg:w-[calc(100%-6rem)] ml-auto lg:pl-12">
                <div class="blog-content max-w-3xl" ws-hole="Body"></div>
            </div>
        </div>
    </div>
  </div>
</main>
