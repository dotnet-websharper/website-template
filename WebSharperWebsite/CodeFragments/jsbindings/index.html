<!DOCTYPE html>
<html lang="en">
<head>
    <title>maps</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" type="text/css" href="Scripts/maps.css" />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] { display: none; }

        html, body { margin: 0; height: 100%; }
        body { font-family: sans-serif; }

        /* The map fills the whole preview, no matter how big it is. */
        .app-container { position: relative; width: 100%; height: 100%; }
        .map-target { position: absolute; inset: 0; }

        /* Floating readout over the map. */
        .overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            font-size: 13px;
            color: #333;
            pointer-events: none;
        }
    </style>
    <script type="text/javascript" src="Scripts/maps.head.js"></script>
</head>
<body>
    <!-- A minimal page: placeholders that the client fills and then binds. -->
    <div class="app-container">
        <div class="map-target" ws-hole="Map">Loading map…</div>
        <div class="overlay" ws-hole="Coordinates">Hover over the map…</div>
    </div>
    <script type="module" src="Scripts/maps.min.js"></script>
</body>
</html>
