name: Build and Deploy to GitHub Pages

on: 
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_bindings:
        description: 'Regenerate bindings.json (NuGet versions, library ranges, sample links) before building'
        type: boolean
        default: true
      commit_bindings:
        description: 'Commit the regenerated bindings.json back to the branch'
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v2.1.1
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      - name: Add GitHub registry NuGet source
        run: 
          dotnet nuget 
            add source https://nuget.pkg.github.com/dotnet-websharper/index.json 
            --name github 
            --username intellifactory-gh 
            --password ${{ secrets.PAT_PACKAGE }} 
            --store-password-in-clear-text

      - name: Build snippets
        shell: bash
        run: |
          for proj in WebSharperWebsite/snippets/*/*.fsproj; do
            echo "Building $proj"
            dotnet build "$proj" -c Release
          done

      - name: Refresh bindings.json
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_bindings
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.PAT_PACKAGE }}
        run: dotnet fsi WebSharperWebsite/scripts/extract-bindings.fsx

      - name: Commit bindings.json
        if: github.event_name == 'workflow_dispatch' && inputs.commit_bindings
        shell: bash
        run: |
          # Compare ignoring the generatedAt timestamp so an unchanged refresh
          # does not commit (and re-trigger this workflow) on every run.
          if python - <<'PY'
          import json, subprocess, sys
          old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:WebSharperWebsite/bindings.json']).decode())
          new = json.load(open('WebSharperWebsite/bindings.json'))
          for d in (old, new):
              d.pop('generatedAt', None)
          sys.exit(0 if old == new else 1)
          PY
          then
            echo "No meaningful binding changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add WebSharperWebsite/bindings.json
            git commit -m "Refresh bindings.json"
            git push
          fi

      - name: Build project
        run: dotnet build -c Release

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: WebSharperWebsite/bin/html
          cname: websharper.com
